<div class="me-container">
  <mat-card>
    <div class="me-picture">
      <mat-icon class="me-icon">person</mat-icon>
    </div>
    <div class="me-username">{{me().username}}</div>

    @if (editMode())
    {
      <markdown-editor
        [initialValue]="'### Start typing here...'"
        (valueChange)="onMarkdownChange($event)"></markdown-editor>
      <div class="output-preview">
        <h3>Raw Output:</h3>
        <pre>{{ currentMarkdown() }}</pre>
      </div>
    } @else {
      <div [innerHtml]="'# abc' | markdown | async"> </div>
    }
    <div class="actions">
      <button matButton="filled" (click)="onLogout()">Logout</button>
    </div>
  </mat-card>
</div>
